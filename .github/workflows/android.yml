name: Build Photon APK
on:
  push:
    branches: ["arena/c217a41b-photon"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -o pipefail
          {
            export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
              unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
              mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-37' 'build-tools;36.0.0'
          } 2>&1 | tee sdk.log
      - name: Build installable debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Photon unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests 'com.prism.music.photon.*' --stacktrace 2>&1 | tee tests.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Photon-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish build diagnostics
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          logs = []
          for name in ['sdk.log', 'build.log', 'tests.log']:
              path = pathlib.Path(name)
              if path.exists():
                  lines = path.read_text(errors='replace').splitlines()
                  errors = [x for x in lines if x.startswith('e: ') or 'error:' in x.lower() or 'Could not' in x or 'FAILURE' in x]
                  logs.append(name + '\n' + '\n'.join(errors[:80]) + '\n' + '\n'.join(lines[-100:]))
          text = '\n\n'.join(logs)[-60000:] or 'Build failed before command logs were created. See Actions step results.'
          pathlib.Path('diagnostics.json').write_text(json.dumps({'name': 'Photon build diagnostics', 'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed', 'conclusion': 'failure', 'output': {'title': 'Build failure details', 'summary': '```text\n' + text + '\n```'}}))
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input diagnostics.json

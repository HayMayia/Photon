name: TV real-frame and Back smoke test
on:
  workflow_dispatch:
  push:
    branches: ["arena/f7d21a23-photon"]
    paths:
      - '.github/workflows/tv-render-smoke.yml'
      - 'old-photon/src/androidTest/**'
      - 'old-photon/src/debug/**'
      - 'old-photon/src/main/java/com/prism/music/photon/**'
permissions:
  contents: read
  checks: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK
        shell: bash
        run: |
          set -o pipefail
          {
            export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
              unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
              mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            fi
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-37.2' 'build-tools;36.0.0'
          } 2>&1 | tee sdk.log
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash -o pipefail -c 'trap "timeout 10 adb logcat -d -t 1800 > render-logcat.log; timeout 10 adb pull /sdcard/Android/data/io.github.haymayia.photon/files/tv-render-smoke.png tv-render-smoke.png || true" EXIT; ./gradlew :old-photon:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.prism.music.photon.TvRenderSmokeTest --stacktrace 2>&1 | tee render.log'
      - name: Collect frame screenshot
        if: always()
        run: |
          echo "Device evidence was collected inside the emulator action before teardown."
          ls -l tv-render-smoke.png render-logcat.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-real-frame-results
          path: |
            tv-render-smoke.png
            render-logcat.log
            old-photon/build/reports/androidTests/
            old-photon/build/outputs/androidTest-results/
      - name: Publish render diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYDIAG'
          import json, pathlib, os
          parts = []
          for pattern in ['render.log', 'sdk.log', 'render-logcat.log', 'old-photon/build/outputs/androidTest-results/**/*.xml']:
              for p in pathlib.Path('.').glob(pattern):
                  parts.append(str(p) + '\n' + p.read_text(errors='replace')[-18000:])
          text = '\n'.join(parts)[-58000:] or 'Failure before render logs. See job annotations.'
          pathlib.Path('render-diag.json').write_text(json.dumps({'name':'TV render diagnostics','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'failure','output':{'title':'Real renderer test failure','summary':'```text\n'+text+'\n```'}}))
          PYDIAG
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input render-diag.json

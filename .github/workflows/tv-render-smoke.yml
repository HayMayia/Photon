name: TV real-frame and Back smoke test
on:
  workflow_dispatch:
  push:
    branches: ["arena/f7d21a23-photon"]
    paths:
      - '.github/workflows/tv-render-smoke.yml'
      - 'old-photon/src/androidTest/**'
      - 'old-photon/src/debug/**'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0' 
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :old-photon:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.prism.music.photon.TvRenderSmokeTest --stacktrace
      - name: Collect frame screenshot
        if: always()
        run: adb pull /sdcard/Android/data/io.github.haymayia.photon/files/tv-render-smoke.png tv-render-smoke.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-real-frame-results
          path: |
            tv-render-smoke.png
            old-photon/build/reports/androidTests/
            old-photon/build/outputs/androidTest-results/
